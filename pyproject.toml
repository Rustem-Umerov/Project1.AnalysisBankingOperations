[project]
name = "project1-analysisbankingoperations"
version = "0.1.0"
description = ""
authors = [
    {name = "Rustem Umerov",email = "rustem.umerov.00@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas (>=2.3.0,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "requests (>=2.32.4,<3.0.0)",
    "python-dotenv (>=1.1.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "project1"}]


[tool.poetry.group.lint.dependencies]
mypy = "^1.16.1"
black = "^25.1.0"
flake8 = "^7.2.0"
isort = "^6.0.1"


[tool.poetry.group.dev.dependencies]
pandas-stubs = "^2.2.3.250527"
types-requests = "^2.32.4.20250611"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = '''
/(
    \.git
)/
'''

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'